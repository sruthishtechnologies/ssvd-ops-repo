name: Validate GitOps

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  helm:
    name: Helm lint and render
    runs-on: ubuntu-latest
    env:
      CHART_PATH: apps/srisatvam/bhoomi-report/chart
      APP_NAME: bhoomi-report
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint "${CHART_PATH}" -f "envs/${{ matrix.environment }}/values/srisatvam/bhoomi-report.yaml"

      - name: Render manifests
        run: |
          mkdir -p rendered
          helm template "${APP_NAME}-${{ matrix.environment }}" "${CHART_PATH}" \
            -f "envs/${{ matrix.environment }}/values/srisatvam/bhoomi-report.yaml" \
            --namespace "ssvd-${{ matrix.environment }}" \
            > "rendered/${{ matrix.environment }}.yaml"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v7
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered/${{ matrix.environment }}.yaml

  conftest:
    name: OPA policy checks
    runs-on: ubuntu-latest
    needs: helm
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download rendered manifests
        uses: actions/download-artifact@v8
        with:
          name: rendered-${{ matrix.environment }}
          path: rendered

      - name: Install Conftest
        env:
          CONFTEST_VERSION: "0.56.0"
        run: |
          curl -sSL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/conftest.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo mv /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Run Kubernetes policies
        run: conftest test "rendered/${{ matrix.environment }}.yaml" --policy policies/conftest/kubernetes --all-namespaces

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    env:
      CHART_PATH: apps/srisatvam/bhoomi-report/chart
      APP_NAME: bhoomi-report
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Render manifests
        run: |
          mkdir -p rendered
          for env in dev staging prod; do
            helm template "${APP_NAME}-${env}" "${CHART_PATH}" \
              -f "envs/${env}/values/srisatvam/bhoomi-report.yaml" \
              --namespace "ssvd-${env}" \
              > "rendered/${env}.yaml"
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .
