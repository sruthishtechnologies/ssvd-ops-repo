apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: srisatvam-bhoomi-report-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sruthishtechnologies/ssvd-ops-repo.git
    targetRevision: main
    path: apps/srisatvam/bhoomi-report/chart
    helm:
      releaseName: bhoomi-report
      valueFiles:
        - ../../../../envs/prod/values/srisatvam/bhoomi-report.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ssvd-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 10
